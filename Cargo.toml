[package]
name = "peersey"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
description = "Batteries-included P2P messaging and content sharing"
repository = "https://github.com/antepodeum/Peersey"
license = "MIT OR Apache-2.0"
keywords = ["iroh", "p2p", "pubsub", "file-sharing", "dht"]
categories = ["network-programming"]

[dependencies]
bytes = "1"
hex = "0.4"
iroh = "=1.0.0-rc.0"
iroh-blobs = { version = "=0.101.0", default-features = false, features = ["fs-store"] }
iroh-gossip = "0.99"
iroh-gossip-rendezvous = "0.2.1"
postcard = { version = "1", features = ["use-std"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rustyline = "17"
tokio = { version = "1", features = ["full"] }

[[example]]
name = "chat"
path = "examples/chat.rs"
