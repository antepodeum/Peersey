[package]
name = "peersey"
version = "0.1.1"
edition = "2024"
rust-version = "1.93"
description = "Zero-config peer discovery for iroh-gossip topics"
license = "MIT OR Apache-2.0"
keywords = ["iroh", "gossip", "p2p", "pubsub", "dht"]
categories = ["network-programming"]

[dependencies]
bytes = "1"
hex = "0.4"
iroh = "=1.0.0-rc.0"
iroh-gossip = "0.99"
iroh-gossip-rendezvous = "0.2.1"
rand = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

[[example]]
name = "chat"
path = "examples/chat.rs"
